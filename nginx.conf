server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/wasm application/json;

    # Hashed build assets never change, so cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The vendored MySQL engine ships .mjs modules, which nginx's default MIME map does not cover.
    # Browsers refuse to run module scripts served with a non-JavaScript type (we send nosniff).
    location ~ \.mjs$ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type text/javascript;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
