<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL Sandbox</title>
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <h1 class="app-name">SQL Sandbox</h1>
      <label class="toolbar-field">
        <span class="visually-hidden">Engine</span>
        <select id="engine-select" aria-label="Database engine">
          <option value="sqlite">SQLite</option>
          <option value="postgres">PostgreSQL</option>
          <option value="mysql">MySQL (MariaDB)</option>
        </select>
      </label>
      <button id="run-button" class="button button-primary" type="button" title="Run the selection, or the whole tab (Ctrl/Cmd+Enter)">Run</button>
      <button id="run-all-button" class="button" type="button" title="Run every tab in order">Run all</button>
      <button id="reset-database-button" class="button" type="button" title="Drop everything and start with an empty database">Reset database</button>
      <span class="toolbar-spacer"></span>
      <span id="autosave-warning" class="autosave-warning" role="status" hidden>Autosave failed (browser storage is full). Download your session to keep it.</span>
      <span id="database-save-warning" class="autosave-warning" role="status" hidden></span>
      <span id="other-tab-warning" class="autosave-warning" role="status" hidden>SQL Sandbox is open in another tab. Both save to the same place, so the last one to save wins.</span>
      <button id="download-button" class="button" type="button" title="Save every tab to one .sql file">Download .sql</button>
      <button id="open-button" class="button" type="button" title="Open a saved session, or .sql scripts as new tabs">Open .sql</button>
      <input id="open-input" type="file" accept=".sql,text/plain,application/sql" multiple hidden />
      <button id="new-session-button" class="button" type="button">New session</button>
      <button id="theme-button" class="button" type="button" aria-label="Toggle dark and light theme">Theme</button>
    </header>

    <main class="workspace">
      <aside class="schema-panel" aria-label="Database schema">
        <h2 class="pane-title">Schema</h2>
        <div id="schema-browser" class="schema-browser"></div>
      </aside>

      <section class="editor-pane">
        <div id="tab-bar" class="tab-bar" role="tablist" aria-label="SQL scripts"></div>
        <div id="editor" class="editor-host"></div>
      </section>

      <section class="results-panel" aria-live="polite">
        <h2 class="pane-title">Results <span id="elapsed-time" class="elapsed-time"></span></h2>
        <div id="results" class="results"></div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
