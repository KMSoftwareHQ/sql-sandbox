# Included in every location: nginx drops server-level add_header lines in any location that sets its own.
# 'wasm-unsafe-eval' lets the SQLite/PostgreSQL WebAssembly engines compile; it does not allow JS eval().
# style-src needs 'unsafe-inline' because CodeMirror injects its editor styles at runtime.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
